<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xml:lang="en" lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="keywords"
      content="DnD, dangeon and dragons, roleplay, dice, roller, 3D, RPG, wargame" />
    <meta name="description" content="Online 3D dice roller" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>teal 3d dice roller</title>

    <link rel="stylesheet" type="text/css" href="./css/main.css" />
    <link rel="stylesheet" type="text/css" href="./css/dice.css" />
  </head>

  <body style="margin: 0" class="noselect">
    <!-- Web Component para lanzar dados -->
    <dice-thrower></dice-thrower>

    <!-- Web Component solo para lanzar dados -->
    <div
      style="
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      ">
      <dice-throw-button></dice-throw-button>
    </div>

    <!-- Web Component para el set de juego en tarjetas -->
    <dice-gameset-drawer></dice-gameset-drawer>

    <!-- Web Component para mostrar resultados -->
    <dice-result></dice-result>

    <!-- Dialog to create custom dice -->
    <create-custom-dice-dialog></create-custom-dice-dialog>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.124.0/build/three.module.js",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
