    <script>
      // Si un chunk de script falla al cargar (404 por versión anterior cacheada en despliegue),
      // fuerza una recarga limpia para sincronizar con la nueva versión en vez de quedar en blanco.
      window.addEventListener(
        'error',
        function (e) {
          if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('dhd_stale_reload')) {
            sessionStorage.setItem('dhd_stale_reload', '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).finally(function () {
                location.reload();
              });
            } else {
              location.reload();
            }
          }
        },
        true,
      );
      window.addEventListener('load', function () { sessionStorage.removeItem('dhd_stale_reload'); });
    </script>
