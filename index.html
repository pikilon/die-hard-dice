<!DOCTYPE html>
<html lang="en">

  <body>
    <game-title></game-title>
    <die-board></die-board>
    <dice-editor></dice-editor>
    <game-actions></game-actions>
    <script type="module">
      import "./web-components/board.js";
      import "./web-components/game-title.js";
      import "./web-components/dice-editor.js";
      import "./web-components/game-actions.js";
      import { subscribe } from './state/game-state.js';
      import { initStateFromUrl } from './state/url-state.js';

      // Initialize state from URL
      initStateFromUrl();

      // Example: subscribe to state changes
      subscribe(state => {
        const title = state.title || "Die hard Dice";

        document.title = `🎲 ${title}`;
      });

    </script>

  </body>
